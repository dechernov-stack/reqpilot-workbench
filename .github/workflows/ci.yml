name: ReqPilot P0

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.14"
  NODE_VERSION: "24.18.1"
  UV_VERSION: "0.8.17"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync the StrictDoc application runtime
        run: uv sync --frozen --extra strictdoc-runtime

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python formatting and lint
        run: |
          .venv/bin/ruff format --check backend tools
          .venv/bin/ruff check backend tools

      - name: Python types
        env:
          PYTHONPATH: backend
        run: .venv/bin/mypy backend/reqpilot

      - name: Validate canonical sources
        run: .venv/bin/python tools/reqpilot.py validate

      - name: Backend tests and coverage
        env:
          PYTHONPATH: backend
        run: >-
          .venv/bin/pytest backend/tests
          --cov=reqpilot
          --cov-report=term-missing
          --cov-report=xml:evidence/backend-coverage.xml
          --cov-fail-under=85

      - name: Frontend formatting, lint and tests
        working-directory: frontend
        run: |
          npm run format
          npm run lint
          npm run test:coverage

      - name: Native non-PDF exports and combined report
        run: .venv/bin/python tools/reqpilot.py export --formats html excel json reqif

      - name: Production build
        run: .venv/bin/python tools/reqpilot.py build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reqpilot-automated-evidence
          path: |
            evidence/
            exports/
            frontend/coverage/
            frontend/dist/

  capellambse-handshake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync isolated capellambse runtime
        env:
          UV_PROJECT_ENVIRONMENT: .venv-capella
        run: uv sync --frozen --extra capella-runtime --no-dev
      - name: Exact version and honest real-model status
        run: .venv-capella/bin/python tools/spike_capella.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reqpilot-capellambse-handshake
          path: evidence/capella-spike.md

  fixture-e2e:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra strictdoc-runtime
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reqpilot-e2e-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/

  pdf:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra strictdoc-runtime
      - name: Discover an offline ChromeDriver
        id: chromedriver
        run: |
          driver="$(command -v chromedriver || true)"
          if [ -n "$driver" ]; then
            echo "path=$driver" >> "$GITHUB_OUTPUT"
          else
            echo "PDF NOT EXECUTED: no local ChromeDriver on the runner" | tee evidence/pdf-ci-skip.txt
          fi
      - name: Native StrictDoc PDF export
        if: steps.chromedriver.outputs.path != ''
        env:
          REQPILOT_CHROMEDRIVER: ${{ steps.chromedriver.outputs.path }}
        run: .venv/bin/python tools/reqpilot.py export --formats pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reqpilot-pdf-output
          path: |
            exports/
            evidence/pdf-ci-skip.txt
